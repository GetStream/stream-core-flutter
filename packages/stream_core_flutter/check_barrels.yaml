# Configuration for the public-barrel coverage check.
#
# Run via:
#   dart run $MELOS_ROOT_PATH/scripts/check_barrels.dart
#
# Or via melos:
#   melos run check:barrels

# The name of this package (used to recognise `package:` self-imports).
package_name: stream_core_flutter

# Public barrels whose exports define the package surface. Every public
# source file under `lib/src/` must appear in exactly one of these.
barrels:
  - lib/chat.dart
  - lib/core.dart

# Public-facing libraries that files under `source_root` must never import.
# Typically: the barrels themselves, plus any deprecated entry points.
forbidden_src_imports:
  - lib/chat.dart
  - lib/core.dart
  - lib/stream_core_flutter.dart

# Full paths (relative to the package root) of directories whose files are
# internal to the package. Anything under these is excluded from coverage.
internal_dirs:
  - lib/src/theme/primitives/internal
  - lib/src/cache/internal
