# Automated migrations for deprecated `stream_core_flutter` APIs.
#
# Customers move off a deprecated member by running:
#
#     dart fix --apply
#
# Keep this file append-only. A transform is what carries someone across the
# release that finally deletes a member, so it has to outlive the deprecation
# that motivated it — never drop an entry just because the member is gone.
#
# Deprecated icons are declared in `assets_source/deprecated.txt`; every icon
# there with `included` set to `true` should have transforms here.
#
# See https://dart.dev/tools/dart-fix for the file format.
version: 1
transforms:
  # ---------------------------------------------------------------------------
  # 0.6.0 — `more` split into `more-horizontal` and `more-vertical-fill`.
  #
  # `moreHorizontal` keeps the original artwork, so it is the drop-in
  # replacement; a caller that wanted the vertical variant has to pick
  # `moreVerticalFill` by hand.
  # ---------------------------------------------------------------------------
  - title: "Rename 'more' to 'moreHorizontal'"
    date: "2026-08-18"
    element:
      uris:
        - "package:stream_core_flutter/core.dart"
        - "package:stream_core_flutter/stream_core_flutter.dart"
        - "package:stream_core_flutter/src/theme/primitives/stream_icons.dart"
      inClass: "StreamIcons"
      field: "more"
    changes:
      - kind: "rename"
        newName: "moreHorizontal"

  - title: "Rename 'StreamIconData.more' to 'StreamIconData.moreHorizontal'"
    date: "2026-08-18"
    element:
      uris:
        - "package:stream_core_flutter/core.dart"
        - "package:stream_core_flutter/stream_core_flutter.dart"
        - "package:stream_core_flutter/src/theme/primitives/stream_icons.dart"
      inClass: "StreamIconData"
      field: "more"
    changes:
      - kind: "rename"
        newName: "moreHorizontal"

  - title: "Rename the 'more' argument to 'moreHorizontal'"
    date: "2026-08-18"
    element:
      uris:
        - "package:stream_core_flutter/core.dart"
        - "package:stream_core_flutter/stream_core_flutter.dart"
        - "package:stream_core_flutter/src/theme/primitives/stream_icons.dart"
      inClass: "StreamIcons"
      constructor: ""
    changes:
      - kind: "renameParameter"
        oldName: "more"
        newName: "moreHorizontal"

  # `copyWith` lives on the generated `_$StreamIcons` mixin, which does not
  # carry the field's `@Deprecated`. So this argument raises no warning while
  # `more` still exists — the transform only fires once the field is deleted and
  # the call becomes an `undefined_named_parameter` error.
  - title: "Rename the 'more' argument of 'copyWith' to 'moreHorizontal'"
    date: "2026-08-18"
    element:
      uris:
        - "package:stream_core_flutter/core.dart"
        - "package:stream_core_flutter/stream_core_flutter.dart"
        - "package:stream_core_flutter/src/theme/primitives/stream_icons.dart"
      inMixin: "_$StreamIcons"
      method: "copyWith"
    changes:
      - kind: "renameParameter"
        oldName: "more"
        newName: "moreHorizontal"
