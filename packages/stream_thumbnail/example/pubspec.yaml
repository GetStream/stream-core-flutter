name: stream_thumbnail_example
description: "An example app for the stream_thumbnail plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  stream_thumbnail: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # A tiny H.264 clip used by the integration tests, so they don't need
    # network access. Generated with:
    #   ffmpeg -f lavfi -i testsrc=size=320x240:rate=15:duration=2 \
    #     -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p \
    #     -crf 30 -movflags +faststart assets/sample_video.mp4
    - assets/sample_video.mp4
