name: stream_thumbnail_example
description: "An example app for the stream_thumbnail plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  stream_thumbnail: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # A tiny H.264 clip used by the integration tests, so they don't need
    # network access. Generated with:
    #   ffmpeg -f lavfi -i testsrc=size=320x240:rate=15:duration=2 \
    #     -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p \
    #     -crf 30 -movflags +faststart assets/sample_video.mp4
    - assets/sample_video.mp4
    # One-frame clips wider than the output cap and the source limit:
    #   ffmpeg -f lavfi -i color=c=red:s=6000x1000:d=1 -frames:v 1 -c:v libx264 \
    #     -pix_fmt yuv420p assets/wide_6000x1000.mp4
    #   ffmpeg -f lavfi -i color=c=blue:s=9000x500:d=1 -frames:v 1 -c:v libx264 \
    #     -pix_fmt yuv420p assets/wide_9000x500.mp4
    - assets/wide_6000x1000.mp4
    - assets/wide_9000x500.mp4
