# Keeps the SHA-pinned actions in workflows and local composite actions current.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers only .github/workflows; the composite actions need their own entry.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # A release must be a week old before it is proposed, so a compromised one has time to be caught.
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(repo)"
