name: Bot Commit
description: >
  Commits changed files to a branch through the GitHub API, so the commit is
  signed by GitHub and attributed to the app whose token is used. The commit is
  refused if the branch moved past `expected-head-sha`.

inputs:
  files:
    description: >
      The files that may be committed: a path or pattern such as `README.md`, or
      several, one per line. Nothing outside them is ever committed.
    required: true
  message:
    description: The commit message; lines after the first become its body.
    required: true
  token:
    description: Token with write access to the repository's contents, such as a GitHub App token.
    required: true
  branch:
    description: The branch to commit to.
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  expected-head-sha:
    description: The commit the changes were made on; nothing is committed if the branch moved past it.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  detect-changes:
    description: >
      `true` commits only the files `git status` reports as added, modified or
      deleted in the workspace checkout. `false` commits every file matching
      `files`, for a workspace that is not a checkout, such as one holding files
      downloaded from another job.
    required: false
    default: "true"

outputs:
  changed:
    description: "`true` when there was something to commit."
    value: ${{ steps.commit.outputs.changed }}
  commit:
    description: The new commit; empty when there was nothing to commit or the branch moved.
    value: ${{ steps.commit.outputs.commit }}
  moved:
    description: "`true` when the branch moved past `expected-head-sha`, so nothing was committed."
    value: ${{ steps.commit.outputs.moved }}

runs:
  using: composite
  steps:
    - name: 📤 Commit through the API
      id: commit
      uses: actions/github-script@v9
      env:
        FILES: ${{ inputs.files }}
        MESSAGE: ${{ inputs.message }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.expected-head-sha }}
        DETECT_CHANGES: ${{ inputs.detect-changes }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const { FILES, MESSAGE, BRANCH, SHA, DETECT_CHANGES } = process.env;
          const workspace = process.env.GITHUB_WORKSPACE;

          const patterns = FILES.split('\n').map((line) => line.trim()).filter(Boolean);
          const additions = [];
          const deletions = [];
          if (DETECT_CHANGES === 'true') {
            // Entries are `XY path`; a rename or copy is followed by its original path.
            const entries = execFileSync('git', ['status', '--porcelain', '-z', '-uall', '--', ...patterns], {
              cwd: workspace,
            }).toString().split('\0');
            for (let i = 0; i < entries.length; i++) {
              if (!entries[i]) continue;
              const [status, file] = [entries[i].slice(0, 2), entries[i].slice(3)];
              if (status[0] === 'R' || status[0] === 'C') {
                const original = entries[++i];
                if (status[0] === 'R') deletions.push(original);
              }
              if (status.includes('D')) deletions.push(file);
              else additions.push(file);
            }
          } else {
            const files = await (await glob.create(patterns.join('\n'), { matchDirectories: false })).glob();
            additions.push(...files.map((file) => path.relative(workspace, file)));
          }

          if (!additions.length && !deletions.length) {
            core.setOutput('changed', 'false');
            return core.info('Nothing to commit.');
          }
          core.setOutput('changed', 'true');

          const [headline, ...body] = MESSAGE.split('\n');
          try {
            const { createCommitOnBranch: { commit } } = await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`, {
              input: {
                branch: { repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, branchName: BRANCH },
                expectedHeadOid: SHA,
                message: { headline, body: body.join('\n').trim() || undefined },
                fileChanges: {
                  additions: additions.map((file) => ({
                    path: file,
                    contents: fs.readFileSync(path.join(workspace, file)).toString('base64'),
                  })),
                  deletions: deletions.map((file) => ({ path: file })),
                },
              },
            });
            core.setOutput('commit', commit.oid);
            core.info(`Committed ${commit.oid}: ${additions.length} added or changed, ${deletions.length} deleted.`);
          } catch (error) {
            if (!/expected branch to point to/i.test(error.message)) throw error;
            core.setOutput('moved', 'true');
            core.warning(`${BRANCH} moved past ${SHA}, so nothing was committed.`);
          }
