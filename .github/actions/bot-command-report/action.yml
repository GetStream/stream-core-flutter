name: Report Bot Command
description: >
  Updates the bot's reply to a command with the `message` output of the job that
  ran it, or with a link to the run when that job did not succeed, and reacts to
  the command with 🚀 or 😕.

# Run it from a job that needs the parse job and every command job, with
# `if: always() && needs.<parse>.outputs.reply-id != ''` and a `token` that can
# write pull requests.

inputs:
  command:
    description: The command that ran.
    required: true
  request:
    description: The `request` output of `bot-command-parse`.
    required: true
  reply-id:
    description: The `reply-id` output of `bot-command-parse`.
    required: true
  results:
    description: "`toJSON(needs)` of the calling job; every job except the parse job is a command job."
    required: true
  parse-job:
    description: The id of the parse job in `results`.
    required: false
    default: parse
  token:
    description: Token used to answer the comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: 💬 Answer the comment
      uses: actions/github-script@v9
      env:
        COMMAND: ${{ inputs.command }}
        REQUEST: ${{ inputs.request }}
        REPLY_ID: ${{ inputs.reply-id }}
        RESULTS: ${{ inputs.results }}
        PARSE_JOB: ${{ inputs.parse-job }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { COMMAND, REQUEST, REPLY_ID, RESULTS, PARSE_JOB } = process.env;
          const { owner, repo } = context.repo;
          const { [PARSE_JOB]: _, ...commands } = JSON.parse(RESULTS);
          const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const job = Object.values(commands).find((job) => job.result !== 'skipped');
          const succeeded = job?.result === 'success';

          const message = succeeded
            ? job.outputs?.message || `\`${COMMAND}\` finished, see the [run](${run}).`
            : `\`${COMMAND}\` failed, see the [run](${run}).`;
          await github.rest.issues.updateComment({
            owner, repo, comment_id: Number(REPLY_ID), body: `> ${REQUEST}\n\n${message}`,
          });

          try {
            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: succeeded ? 'rocket' : 'confused',
            });
          } catch (error) {
            core.warning(`Could not react to the comment: ${error.message}`);
          }
