name: Flutter Web PR Comment
description: >
  Comments the link to a pull request's web build on the pull request, or
  updates that comment when the build is removed. One comment per app.

# The job needs `pull-requests: write`.

inputs:
  app:
    description: The top-level folder on the host, such as `chat`.
    required: true
  url:
    description: The build's URL, the `url` output of flutter-web-target. Empty when the build was removed.
    required: false
    default: ""
  label:
    description: The label that deploys the build, named in the comment.
    required: false
    default: build

runs:
  using: composite
  steps:
    - name: 💬 Comment the Link
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        APP: ${{ inputs.app }}
        URL: ${{ inputs.url }}
        LABEL: ${{ inputs.label }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { APP, URL, LABEL } = process.env;
          const marker = `<!-- web-deploy-pr:${APP} -->`;
          const sha = context.payload.pull_request.head.sha.slice(0, 7);
          const body = URL
            ? [
                marker,
                `**Web build (${APP}):** ${URL}`,
                '',
                `Built from ${sha}. Updates on every push while the \`${LABEL}\` label is set.`,
              ].join('\n')
            : `${marker}\n**Web build (${APP}):** removed.`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find((c) => c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else if (URL) {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
