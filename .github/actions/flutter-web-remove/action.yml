name: Flutter Web Remove
description: >
  Removes a pull request build from https://flutter.getstream.io. Take `path`
  and `service-account` from flutter-web-target with the `pr` flavor. Passes
  when there is no build.

# The job needs `id-token: write` and the GitHub environment `flutter-web-pr`:
# the identity provider only admits runs in it.

inputs:
  path:
    description: The pull request build's folder in the bucket, the `path` output of flutter-web-target.
    required: true
  service-account:
    description: The account to remove it as, the `service-account` output of flutter-web-target.
    required: true

runs:
  using: composite
  steps:
    - name: 🎯 Check Target
      shell: bash
      env:
        WEB_PATH: ${{ inputs.path }}
      run: |
        if [[ ! $WEB_PATH =~ ^[a-z0-9-]+/pr/[0-9]+$ ]]; then
          echo "::error::only pull request builds are removed, got '$WEB_PATH'"
          exit 1
        fi

    - name: 🔑 Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/675676272957/locations/global/workloadIdentityPools/github-actions/providers/github-flutter
        service_account: ${{ inputs.service-account }}

    - name: ☁️ Setup gcloud
      uses: google-github-actions/setup-gcloud@v3

    # Syncing an empty folder deletes every object of the build, and passes
    # when there is none.
    - name: 🗑️ Remove
      shell: bash
      env:
        WEB_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        empty=$(mktemp -d)
        gcloud storage rsync "$empty" "gs://stream-flutter-web/$WEB_PATH" \
          --recursive --delete-unmatched-destination-objects
