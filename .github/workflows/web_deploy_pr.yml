name: web_deploy_pr

# Reusable workflow that deploys the Flutter web app of a pull request labeled
# `build` to https://flutter.getstream.io/<app>/pr/<number>/ and comments the
# link on the pull request. Every push to the pull request deploys again.
#
# The build is removed when the label is removed or the pull request closes.
# web_deploy.yml also removes builds that were last deployed over 30 days ago.
#
# The host serves an app's index.html for unknown paths under /<app>/ and
# /<app>/beta/ only, so a pull request build has to keep its routes after a
# `#`. The build gets these defines:
#
#   WEB_FLAVOR          beta.
#   WEB_HASH_URLS       true. Use the hash URL strategy when it is set.
#   WEB_STORAGE_PREFIX  <app>_pr_, with dashes in <app> replaced by
#                       underscores, shared by every pull request build of the
#                       app. Prefix every key the app stores in the browser
#                       with it.
#
# Call it from a workflow that runs on `pull_request` with the types `labeled`,
# `unlabeled`, `synchronize`, `reopened` and `closed`, and grants
# `contents: read`, `id-token: write` and `pull-requests: write`. The caller
# needs the GitHub environment `flutter-web-pr`, without branch rules: a
# pull request run deploys from `<number>/merge`. Its runs deploy as
# flutter-web-pr-deployer, which can write only under /<app>/pr/. Fork pull
# requests are skipped: their runs get no identity token.

on:
  workflow_call:
    inputs:
      app:
        description: The top-level folder on the host, such as `video`, `chat` or `design-system`.
        required: true
        type: string
      working-directory:
        description: The Flutter app to build, such as `apps/design_system_gallery`.
        required: true
        type: string
      bootstrap:
        description: Run `melos bootstrap` before building, so the app resolves the packages of this repository.
        required: false
        type: boolean
        default: false
      flutter-version:
        description: The Flutter version to build with. Empty takes the latest of `flutter-channel`.
        required: false
        type: string
        default: ""
      flutter-channel:
        description: The Flutter channel to build with.
        required: false
        type: string
        default: stable
      wasm:
        description: Compile to WebAssembly.
        required: false
        type: boolean
        default: true
      build-args:
        description: More arguments for `flutter build web`, split on spaces.
        required: false
        type: string
        default: ""

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Any label change starts the caller, so a `labeled` run only builds when
    # the label added is `build`.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'build') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build')
    # Set on the jobs rather than the workflow, so a run that skips both jobs
    # (another label added) leaves a running deploy alone.
    concurrency:
      group: web-deploy-pr-${{ inputs.app }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: flutter-web-pr
      url: https://flutter.getstream.io/${{ inputs.app }}/pr/${{ github.event.pull_request.number }}/
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      APP: ${{ inputs.app }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 🎯 Resolve Target
        run: |
          if [[ ! $APP =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::app must be a lowercase folder name, got '$APP'"
            exit 1
          fi
          echo "WEB_PATH=$APP/pr/$PR_NUMBER" >> "$GITHUB_ENV"
          echo "WEB_STORAGE_PREFIX=${APP//-/_}_pr_" >> "$GITHUB_ENV"

      - name: 📚 Checkout
        uses: actions/checkout@v6

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}

      - name: 🧩 Bootstrap Workspace
        if: inputs.bootstrap
        run: |
          flutter pub global activate melos
          flutter pub global run melos bootstrap

      - name: 🏗️ Build
        working-directory: ${{ inputs.working-directory }}
        env:
          WASM: ${{ inputs.wasm }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          args=(
            --release
            --base-href "/$WEB_PATH/"
            --dart-define=WEB_FLAVOR=beta
            --dart-define=WEB_HASH_URLS=true
            --dart-define=WEB_STORAGE_PREFIX="$WEB_STORAGE_PREFIX"
          )
          if [[ $WASM == true ]]; then args+=(--wasm); fi
          read -ra extra <<< "$BUILD_ARGS"
          flutter build web "${args[@]}" "${extra[@]}"

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/675676272957/locations/global/workloadIdentityPools/github-actions/providers/github-flutter
          service_account: flutter-web-pr-deployer@stream-gcp-2026-v2.iam.gserviceaccount.com

      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # index.html is uploaded last, after the files it loads, and is never
      # stored by the browser.
      - name: 🚀 Deploy
        env:
          BUILD_DIR: ${{ inputs.working-directory }}/build/web
        run: |
          gcloud storage rsync "$BUILD_DIR" "gs://stream-flutter-web/$WEB_PATH" \
            --recursive --delete-unmatched-destination-objects \
            --exclude='^index\.html$' \
            --cache-control="public, max-age=60"
          gcloud storage cp "$BUILD_DIR/index.html" "gs://stream-flutter-web/$WEB_PATH/index.html" \
            --cache-control="no-store"

      - name: 💬 Comment the Link
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = `<!-- web-deploy-pr:${process.env.APP} -->`;
            const body = [
              marker,
              `**Web build (${process.env.APP}):** https://flutter.getstream.io/${process.env.WEB_PATH}/`,
              '',
              `Built from ${sha}. Updates on every push while the \`build\` label is set.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'build')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'build'))
    # Shares the deploy's group, so it stops a deploy that is still running.
    concurrency:
      group: web-deploy-pr-${{ inputs.app }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # The identity provider only accepts runs in this environment.
    environment:
      name: flutter-web-pr
    permissions:
      id-token: write
      pull-requests: write
    env:
      APP: ${{ inputs.app }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 🎯 Resolve Target
        run: |
          if [[ ! $APP =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::app must be a lowercase folder name, got '$APP'"
            exit 1
          fi
          echo "WEB_PATH=$APP/pr/$PR_NUMBER" >> "$GITHUB_ENV"

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/675676272957/locations/global/workloadIdentityPools/github-actions/providers/github-flutter
          service_account: flutter-web-pr-deployer@stream-gcp-2026-v2.iam.gserviceaccount.com

      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Syncing an empty folder deletes every object of the build, and passes
      # when there is none.
      - name: 🗑️ Remove
        run: |
          mkdir empty
          gcloud storage rsync empty "gs://stream-flutter-web/$WEB_PATH" \
            --recursive --delete-unmatched-destination-objects

      - name: 💬 Update the Comment
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = `<!-- web-deploy-pr:${process.env.APP} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: `${marker}\n**Web build (${process.env.APP}):** removed.`,
              });
            }
