name: update_goldens

on: workflow_dispatch

permissions:
  contents: read

# A newer run on the same branch replaces an older one; the older one's commit
# would be refused anyway once the branch moves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders on a free runner, the one `test` in stream_core_flutter_workflow.yml
  # compares on; change both together.
  render:
    name: Render Goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🧩 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        continue-on-error: true
        run: melos run update:goldens

      - name: 📤 Upload Goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: "**/test/**/goldens/**/*.png"
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit Goldens
    needs: render
    uses: ./.github/workflows/commit_artifact.yml
    with:
      artifact: goldens
      files: "**/test/**/goldens/**/*.png"
      message: "chore: Update Goldens"
      client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
