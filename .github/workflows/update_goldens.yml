name: update_goldens

on: workflow_dispatch

permissions:
  contents: read

jobs:
  # Renders on a free runner, the one `test` in stream_core_flutter_workflow.yml
  # compares on; change both together.
  render:
    name: Render Goldens
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🧩 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        continue-on-error: true
        run: melos run update:goldens

      - name: 📤 Upload Goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: "**/test/**/goldens/**/*.png"
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit Goldens
    needs: render
    uses: ./.github/workflows/commit_artifact.yml
    with:
      artifact: goldens
      files: "**/test/**/goldens/**/*.png"
      message: "chore: Update Goldens"
      client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
