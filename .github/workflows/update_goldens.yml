name: update_goldens

on:
  workflow_dispatch:
  # Run by the `/update-goldens` bot command, see bot_commands.yml.
  workflow_call:
    inputs:
      ref:
        description: "Branch the goldens are pushed to"
        type: string
        required: true
      sha:
        description: "Commit the goldens are generated from; nothing is pushed if the branch moved past it"
        type: string
        required: true
    outputs:
      message:
        description: "Reply to the command"
        value: ${{ jobs.summarize.outputs.message }}

permissions:
  contents: read

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      update: ${{ steps.update.outcome }}
    steps:
      - name: 📚 Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Tools
        run: flutter pub global activate melos

      - name: 🔧 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🖼️ Update Goldens
        id: update
        continue-on-error: true
        run: melos run update:goldens

      - name: 🔍 Detect changed goldens
        id: detect
        run: |
          if [[ -z "$(git status --porcelain -- '**/test/**/goldens/*.png')" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Bundle goldens
        if: steps.detect.outputs.changed == 'true'
        run: |
          git ls-files -z --modified --others --exclude-standard -- '**/test/**/goldens/*.png' \
            | tar --null -czf goldens.tgz -T -

      - name: 📤 Upload goldens artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: goldens.tgz
          retention-days: 1

  # Runs apart from the job above so the bot token never shares a job with the
  # pull request's code.
  commit_goldens:
    needs: update_goldens
    if: needs.update_goldens.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      moved: ${{ steps.commit.outputs.moved }}
    steps:
      - name: 📥 Download goldens
        uses: actions/download-artifact@v8
        with:
          name: goldens

      - name: 📦 Extract goldens
        run: |
          # The archive comes from the pull request's code, so only goldens are extracted.
          tar -xzf goldens.tgz --wildcards --wildcards-match-slash '*/goldens/*.png'
          rm goldens.tgz

      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      # Committing through the API signs the commit, and `expectedHeadOid` refuses it
      # if the branch moved past the commit the goldens were generated from.
      - name: 📤 Commit the goldens
        id: commit
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
          SHA: ${{ inputs.sha || github.sha }}
        with:
          github-token: ${{ steps.ci-bot-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = await (await glob.create('**/goldens/**/*.png')).glob();
            const additions = files.map((file) => ({
              path: path.relative(process.env.GITHUB_WORKSPACE, file),
              contents: fs.readFileSync(file).toString('base64'),
            }));

            try {
              const { createCommitOnBranch: { commit } } = await github.graphql(`
                mutation($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) { commit { oid } }
                }`, {
                input: {
                  branch: {
                    repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                    branchName: process.env.BRANCH,
                  },
                  expectedHeadOid: process.env.SHA,
                  message: { headline: 'chore: Update Goldens' },
                  fileChanges: { additions },
                },
              });
              core.setOutput('commit', commit.oid);
            } catch (error) {
              if (!/expected branch to point to/i.test(error.message)) throw error;
              core.setOutput('moved', 'true');
            }

  summarize:
    needs: [update_goldens, commit_goldens]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.summarize.outputs.message }}
    steps:
      - name: 📝 Summarize
        id: summarize
        env:
          COMMIT: ${{ needs.commit_goldens.outputs.commit }}
          MOVED: ${{ needs.commit_goldens.outputs.moved }}
          TESTS_FAILED: ${{ needs.update_goldens.outputs.update == 'failure' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$MOVED" == "true" ]]; then
            message="The branch moved while the goldens were updating, so nothing was pushed. Run the command again."
          elif [[ -n "$COMMIT" ]]; then
            message="Updated the goldens in $COMMIT."
          elif [[ "$TESTS_FAILED" == "true" ]]; then
            message="No goldens changed."
          else
            message="The goldens are already up to date."
          fi
          if [[ "$TESTS_FAILED" == "true" ]]; then
            message="$message Some golden tests could not run, see the [run]($RUN)."
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "message=$message" >> "$GITHUB_OUTPUT"
