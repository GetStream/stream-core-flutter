name: pr_labels

# Keeps the review-state labels (ready, pending, approved) of this repository's
# pull requests in sync. See pr_review_labels.yml.

on:
  pull_request:
    types:
      - opened
      - labeled
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review_labels:
    name: Review Labels
    uses: ./.github/workflows/pr_review_labels.yml
