name: stream_thumbnail_native_builds

env:
  FLUTTER_CHANNEL: stable

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'packages/stream_thumbnail/**'
      - '.github/actions/bootstrap/action.yml'
      - '.github/workflows/stream_thumbnail_native_builds.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/stream_thumbnail/**'
      - '.github/actions/bootstrap/action.yml'
      - '.github/workflows/stream_thumbnail_native_builds.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build APK
        run: flutter build apk --debug

  ios:
    name: Build iOS
    timeout-minutes: 20
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

  macos:
    name: Build macOS
    timeout-minutes: 20
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build macOS
        run: flutter build macos --debug

  windows:
    name: Build Windows
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build Windows
        run: flutter build windows --debug

  linux:
    name: Build Linux
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libwebp-dev

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build Linux
        run: flutter build linux --debug

  web:
    name: Build Web
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stream_thumbnail/example
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap
        with:
          flutter-channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 🏗️ Build Web
        run: flutter build web
