name: stream_core_flutter_workflow

env:
  FLUTTER_CHANNEL: stable
  ENV_PROPERTIES: ${{ secrets.ENV_PROPERTIES }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      IS_CI: 'true'
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 📦 Install Tools
        run: |
          flutter pub global activate melos

      - name: 🧩 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🔍 Dart Analyze
        run: |
          melos run analyze

      - name: 🧱 Check Barrels and Tokens
        run: |
          melos run check:barrels
          melos run check:tokens

      - name: 🎨 Check Formatting
        run: |
          melos run format:verify

  test:
    needs: analyze
    timeout-minutes: 15
    # The runner update_goldens renders on (its `render` job), so a golden that
    # renders differently on another image can still be regenerated to match.
    # Change both together.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    env:
      IS_CI: 'true'
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: 📦 Install Tools
        run: |
          flutter pub global activate melos
          flutter pub global activate remove_from_coverage

      - name: 🧩 Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: 🧪 Flutter Test
        run: melos run test:all

      - name: 📊 Collect Coverage
        run: melos run coverage:ignore-file --no-select

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: packages/*/coverage/lcov.info
          disable_search: true
