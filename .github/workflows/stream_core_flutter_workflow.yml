name: stream_core_flutter_workflow

env:
  FLUTTER_CHANNEL: stable
  ENV_PROPERTIES: ${{ secrets.ENV_PROPERTIES }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      IS_CI: 'true'
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Tools
        run: |
          flutter pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: Dart Analyze
        run: |
          melos run analyze

      - name: Check barrels and tokens
        run: |
          melos run check:barrels
          melos run check:tokens

      - name: Check formatting
        run: |
          melos run format:verify

  test:
    needs: analyze
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    env:
      IS_CI: 'true'
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Tools
        run: |
          flutter pub global activate melos
          flutter pub global activate remove_from_coverage

      - name: Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: Flutter Test
        id: test
        run: melos run test:all

      # On a pull request whose golden tests fail, keep the regenerated goldens so
      # the `update-goldens` bot command can commit them without running its code.
      - name: Update Goldens
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        run: melos run update:goldens

      - name: Collect Updated Goldens
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/updated-goldens"
          git ls-files -z --modified --others --exclude-standard -- ':(glob)**/test/**/goldens/**/*.png' \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/updated-goldens" --

      - name: Upload Updated Goldens
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: updated-goldens
          path: ${{ runner.temp }}/updated-goldens
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect Coverage
        run: melos run coverage:ignore-file --no-select

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: packages/*/coverage/lcov.info
