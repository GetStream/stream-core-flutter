name: stream_core_flutter_workflow

env:
  FLUTTER_CHANNEL: stable
  ENV_PROPERTIES: ${{ secrets.ENV_PROPERTIES }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      IS_CI: 'true'
    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in requests, and this job
      # makes no other GitHub call, so it runs on a free standard runner.
      - name: Git Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$SHA"
          git checkout -q --detach "$SHA"
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Tools
        run: |
          flutter pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: Dart Analyze
        run: |
          melos run analyze

      - name: Check barrels and tokens
        run: |
          melos run check:barrels
          melos run check:tokens

      - name: Check formatting
        run: |
          melos run format:verify

  test:
    needs: analyze
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    env:
      IS_CI: 'true'
    steps:
      - name: Git Checkout
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$SHA"
          git checkout -q --detach "$SHA"
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Tools
        run: |
          flutter pub global activate melos
          flutter pub global activate remove_from_coverage

      - name: Bootstrap Workspace
        run: melos bootstrap --verbose

      - name: Flutter Test
        run: melos run test:all

      - name: Collect Coverage
        run: melos run coverage:ignore-file --no-select

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: packages/*/coverage/lcov.info
