name: 'PR is Conventional and Semantic'
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      # [changelog_placement] can be waived with the `changelog-override`
      # label, so it has to re-run when labels change.
      - labeled
      - unlabeled
    branches:
      - main
        
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional_pr_title:
    runs-on:
      group: github-public-amd64
    timeout-minutes: 5
    steps:
      - name: 🏷️ Check PR Title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        with: 
          scopes: |
            llc
            ui
            repo
            thumb
          requireScope: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semantic_changelog_update:
    needs: conventional_pr_title # Trigger after the [conventional_pr_title] completes
    runs-on:
      group: github-public-amd64
    timeout-minutes: 5
    steps:
      - name: 📝 Check Changelog Update
        uses: GetStream/verify-semantic-changelog-update@566b49e5ce5f180280336053428f7e2338a4d496 # v1.1.0
        with:
          scopes: |
            {
              "llc": "packages/stream_core",
              "ui": "packages/stream_core_flutter",
              "thumb": "packages/stream_thumbnail"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # [semantic_changelog_update] checks that a changelog was updated at all; this
  # checks that the entries went under `## Upcoming` rather than into a section
  # for a version that is already published.
  changelog_placement:
    name: Check Changelog Placement
    runs-on:
      group: github-public-amd64
    timeout-minutes: 5
    steps:
      - name: 📝 Check Changelog Placement
        uses: GetStream/verify-semantic-changelog-update/placement@566b49e5ce5f180280336053428f7e2338a4d496 # v1.1.0
