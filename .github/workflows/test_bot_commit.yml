name: test_bot_commit

# Temporary: exercises the bot-commit action before it merges. Removed before merging.
# Runs only when this file changes, so the bot's own commits don't start it again.
on:
  push:
    branches: [ci/bot-commit-refuse-links]
    paths: [.github/workflows/test_bot_commit.yml]

permissions:
  contents: read

jobs:
  link_without_checkout:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p tmp-bot-commit-test && ln -s /proc/self/environ tmp-bot-commit-test/leak.png && echo ok > tmp-bot-commit-test/ok.png
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
      - id: commit
        continue-on-error: true
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@ci/bot-commit-refuse-links
        with:
          files: "**/*.png"
          message: "test: link without checkout"
          token: ${{ steps.token.outputs.token }}
          detect-changes: false
      - env:
          OUTCOME: ${{ steps.commit.outcome }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: test "$OUTCOME" = failure && test -z "$COMMIT"

  link_in_checkout:
    needs: link_without_checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: mkdir -p tmp-bot-commit-test && ln -s /proc/self/environ tmp-bot-commit-test/leak.png
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
      - id: commit
        continue-on-error: true
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@ci/bot-commit-refuse-links
        with:
          files: tmp-bot-commit-test/**
          message: "test: link in checkout"
          token: ${{ steps.token.outputs.token }}
      - env:
          OUTCOME: ${{ steps.commit.outcome }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: test "$OUTCOME" = failure && test -z "$COMMIT"

  regular_file:
    needs: link_in_checkout
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p tmp-bot-commit-test && echo regular > tmp-bot-commit-test/regular.png
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
      - id: commit
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@ci/bot-commit-refuse-links
        with:
          files: tmp-bot-commit-test/**
          message: "test: regular file"
          token: ${{ steps.token.outputs.token }}
          detect-changes: false
      - env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT" --jq '[.files[].filename]|join(" ")')" = tmp-bot-commit-test/regular.png
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT" --jq .commit.verification.verified)" = true
