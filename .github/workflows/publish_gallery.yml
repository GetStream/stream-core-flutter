name: Publish Design System Gallery

# Deploys the gallery to https://flutter.getstream.io/design-system/beta/ on
# every push to main, and to https://flutter.getstream.io/design-system/ when
# stream_core_flutter is released, since the gallery shows its components.
# Pre-release tags are not deployed. A manual run deploys prod from a release
# tag (stream_core_flutter-vX.Y.Z) and beta from any other ref, pre-release
# tags included.
#
# Prod deploys when the tag is pushed, while release_publish still waits for
# the pub.dev approval. If that approval is declined, prod shows a version
# that is not on pub.dev until the next release.
#
# Pushes to main also publish the gallery to GitHub Pages.

on:
  push:
    branches:
      - main
    tags:
      - 'stream_core_flutter-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy_gallery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: config git
        run: |
          git config --global user.email "$(git log --format='%ae' HEAD^!)"
          git config --global user.name "$(git log --format='%an' HEAD^!)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Tools
        run: flutter pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Build and Deploy
        uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /stream-core-flutter/
          workingDir: apps/design_system_gallery

  # A release tag deploys prod, anything else beta. Expressions have no regex,
  # so a manual run from a pre-release tag is told apart here.
  flavor:
    name: Pick Flavor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flavor: ${{ steps.flavor.outputs.flavor }}
    steps:
      - name: Pick Flavor
        id: flavor
        run: |
          if [[ $GITHUB_REF =~ ^refs/tags/stream_core_flutter-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=beta" >> "$GITHUB_OUTPUT"
          fi

  deploy_hosted:
    name: Deploy to flutter.getstream.io
    needs: flavor
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/web_deploy.yml
    with:
      app: design-system
      flavor: ${{ needs.flavor.outputs.flavor }}
      working-directory: apps/design_system_gallery
      bootstrap: true
