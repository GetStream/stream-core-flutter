name: Publish Design System Gallery

# Deploys the gallery to https://flutter.getstream.io/design-system/beta/ on
# every push to main, and publishes it to GitHub Pages. A manual run on main
# deploys beta again; flutter-web refuses other branches.
#
# Prod (https://flutter.getstream.io/design-system/) is deployed by
# release_publish.yml, once a stream_core_flutter release is on pub.dev.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy_gallery:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: github-public-amd64
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: config git
        run: |
          git config --global user.email "$(git log --format='%ae' HEAD^!)"
          git config --global user.name "$(git log --format='%an' HEAD^!)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Tools
        run: flutter pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Build and Deploy
        uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /stream-core-flutter/
          workingDir: apps/design_system_gallery

  deploy_hosted:
    name: Deploy to flutter.getstream.io
    runs-on:
      group: github-public-amd64
    timeout-minutes: 20
    concurrency:
      group: web-deploy-design-system-beta
      cancel-in-progress: true
    environment:
      name: flutter-web
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v6

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap

      - name: 🎯 Target
        id: target
        uses: ./.github/actions/flutter-web-target
        with:
          app: design-system
          flavor: beta

      - name: 🏗️ Build
        working-directory: apps/design_system_gallery
        env:
          BUILD_ARGS: ${{ steps.target.outputs.build-args }}
        run: |
          read -ra args <<< "$BUILD_ARGS"
          flutter build web --release --wasm "${args[@]}"

      - name: 🚀 Deploy
        uses: ./.github/actions/flutter-web-deploy
        with:
          path: ${{ steps.target.outputs.path }}
          service-account: ${{ steps.target.outputs.service-account }}
          build-dir: apps/design_system_gallery/build/web
