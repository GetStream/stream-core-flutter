name: Publish Design System Gallery

# Deploys the gallery to https://flutter.getstream.io/design-system/beta/ on
# every push to main, and publishes it to GitHub Pages. A manual run on main
# deploys beta again; flutter-web refuses other branches.
#
# Prod (https://flutter.getstream.io/design-system/) is deployed by
# release_publish.yml, once a stream_core_flutter release is on pub.dev.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds on a free runner; only the push below needs the static-IP runners.
  build_gallery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Tools
        run: flutter pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Build
        working-directory: apps/design_system_gallery
        run: flutter build web --release --base-href /stream-core-flutter/

      - name: Upload Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-pages
          path: apps/design_system_gallery/build/web
          if-no-files-found: error
          retention-days: 1

  # Replaces gh-pages with a commit on top of main holding only the build.
  publish_pages:
    needs: build_gallery
    runs-on:
      group: github-public-amd64
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gallery-pages
          path: ${{ runner.temp }}/gallery-pages

      - name: Push to gh-pages
        env:
          BUILD_DIR: ${{ runner.temp }}/gallery-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git --work-tree "$BUILD_DIR" add --all
          git commit -m "Automatic deployment by github-actions"
          git push origin HEAD:gh-pages --force

  deploy_hosted:
    name: Deploy to flutter.getstream.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: web-deploy-design-system-beta
      cancel-in-progress: true
    environment:
      name: flutter-web
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🧩 Bootstrap Workspace
        uses: ./.github/actions/bootstrap

      - name: 🎯 Target
        id: target
        uses: ./.github/actions/flutter-web-target
        with:
          app: design-system
          flavor: beta

      - name: 🏗️ Build
        working-directory: apps/design_system_gallery
        env:
          BUILD_ARGS: ${{ steps.target.outputs.build-args }}
        run: |
          read -ra args <<< "$BUILD_ARGS"
          flutter build web --release --wasm "${args[@]}"

      - name: 🚀 Deploy
        uses: ./.github/actions/flutter-web-deploy
        with:
          path: ${{ steps.target.outputs.path }}
          service-account: ${{ steps.target.outputs.service-account }}
          build-dir: apps/design_system_gallery/build/web
