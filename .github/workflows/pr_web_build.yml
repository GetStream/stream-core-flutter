name: pr_web_build

# Deploys the gallery of a pull request labeled `build` to
# https://flutter.getstream.io/design-system/pr/<number>/. See
# web_deploy_pr.yml.

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  gallery:
    uses: ./.github/workflows/web_deploy_pr.yml
    with:
      app: design-system
      working-directory: apps/design_system_gallery
      bootstrap: true
