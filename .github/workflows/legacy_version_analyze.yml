name: legacy_version_analyze

env:
  # Note: The versions below should be manually updated after a new stable
  # version comes out.
  flutter_version: "3.44.0"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the analysis runs: on every push, and on a pull request
  # that is not a draft and changes a package. A job skipped this way reports
  # `success` to branch protection, while a workflow skipped by `on.paths`
  # never reports and leaves a required check waiting forever. See
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' || (steps.filter.outputs.packages == 'true' && github.event.pull_request.draft != true) }}
    steps:
      # A pull request checks out its test merge commit, whose first parent is
      # the base branch, so the last two commits hold exactly its changes.
      # --no-renames lists a moved file under both paths, so moving one out of
      # packages/ still counts.
      - name: 📚 Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🔍 Detect Package Changes
        if: github.event_name == 'pull_request'
        id: filter
        run: |
          if git diff --name-only --no-renames HEAD^1 HEAD | grep -qE '^(packages/|\.github/workflows/legacy_version_analyze\.yml$)'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  # Does a sanity check that packages at least pass analysis on the N-1
  # versions of Flutter stable if the package claims to support that version.
  # This is to minimize accidentally making changes that break old versions
  # (which we don't commit to supporting, but don't want to actively break)
  # without updating the constraints.
  analyze_legacy_version:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: "Install Flutter"
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version: ${{ env.flutter_version }}

      - name: 📊 Analyze and test packages
        uses: ./.github/actions/package_analysis
