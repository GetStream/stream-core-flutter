name: legacy_version_analyze

env:
  # Note: The versions below should be manually updated after a new stable
  # version comes out.
  flutter_version: "3.44.0"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    # ready_for_review: a draft's skipped check stays green otherwise, so a
    # draft marked ready would merge unanalyzed until its next push.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the analysis runs: on every push, and on a pull request
  # that is not a draft and changes a package. A job skipped this way reports
  # `success` to branch protection, while a workflow skipped by `on.paths`
  # never reports and leaves a required check waiting forever. See
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  gate:
    name: Check Package Changes
    uses: ./.github/workflows/detect_changes.yml
    with:
      paths: |
        packages/**
        .github/workflows/legacy_version_analyze.yml

  # Does a sanity check that packages at least pass analysis on the N-1
  # versions of Flutter stable if the package claims to support that version.
  # This is to minimize accidentally making changes that break old versions
  # (which we don't commit to supporting, but don't want to actively break)
  # without updating the constraints.
  # No `name:`: the ruleset requires this check by its job ID. Runs when the
  # gate fails too: a skipped required check passes, so skipping then would
  # let a broken gate wave every pull request through.
  analyze_legacy_version:
    needs: gate
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.gate.result != 'success' || (needs.gate.outputs.changed == 'true' && github.event.pull_request.draft != true)) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version: ${{ env.flutter_version }}

      - name: 📊 Analyze and test packages
        uses: ./.github/actions/package_analysis
