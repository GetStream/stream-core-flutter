name: pana

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stream_core:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_core
          min_score: 120  # Missing 10 points for no example, 10 points for no license, 10 points for static analysis issues, and 10 points for outdated dependencies (cross_file 0.4.0 requires Flutter).

  stream_core_flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_core_flutter
          min_score: 110  # Missing 10 points for no license, 10 points for no example, 20 points for static analysis issues (including the path dependency on stream_core that the pana action sets up), and 10 points for outdated dependencies (shimmer 4.0.0).

  stream_thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_thumbnail
          min_score: 140  # Missing 10 points for static analysis issues and 10 points for outdated dependencies (cross_file 0.4.0 is a breaking federated rewrite).
