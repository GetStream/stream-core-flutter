name: bot_commands

# Runs `@stream-flutter-ci-bot <command> [argument]`, or `/<command> [argument]`,
# from the first line of a pull request comment.
#
# To add a command:
#   1. Write a workflow with a `workflow_call` trigger whose `ref` and `sha`
#      inputs receive the pull request's branch and head commit, and whose
#      `message` output is the reply posted back on the pull request.
#   2. Add the command to `commands` in the `parse` job.
#   3. Add a job calling the workflow below, and list it in `report.needs`.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  parse:
    if: |
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/') || startsWith(github.event.comment.body, '@stream-flutter-ci-bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      command: ${{ steps.parse.outputs.command }}
      argument: ${{ steps.parse.outputs.argument }}
      ref: ${{ steps.parse.outputs.ref }}
      sha: ${{ steps.parse.outputs.sha }}
      request: ${{ steps.parse.outputs.request }}
      reply-id: ${{ steps.parse.outputs.reply-id }}
    steps:
      - name: 📚 Checkout the bot actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      # Answers as the bot, so replies come from the app the comment mentions.
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: 🎯 Parse the command
        id: parse
        uses: ./.github/actions/bot-command-parse
        with:
          token: ${{ steps.ci-bot-token.outputs.token }}
          commands: |
            {
              "update-goldens": {
                "description": "Commits the goldens this pull request's CI regenerated when its golden tests failed."
              }
            }

  update_goldens:
    needs: parse
    if: needs.parse.outputs.command == 'update-goldens'
    permissions:
      actions: read # Required to find the CI run and download its artifact
    uses: ./.github/workflows/apply_goldens.yml
    secrets:
      FLUTTER_CI_BOT_PRIVATE_KEY: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
    with:
      ref: ${{ needs.parse.outputs.ref }}
      sha: ${{ needs.parse.outputs.sha }}

  report:
    needs: [parse, update_goldens]
    if: always() && needs.parse.outputs.reply-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📚 Checkout the bot actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      # Answers as the bot, so replies come from the app the comment mentions.
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: 💬 Answer the comment
        uses: ./.github/actions/bot-command-report
        with:
          token: ${{ steps.ci-bot-token.outputs.token }}
          command: ${{ needs.parse.outputs.command }}
          request: ${{ needs.parse.outputs.request }}
          reply-id: ${{ needs.parse.outputs.reply-id }}
          results: ${{ toJSON(needs) }}
