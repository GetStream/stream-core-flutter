name: sync_style_guides

# Copies `style_guides/` into the other Stream Flutter SDKs and opens a pull
# request in each one whose copy changed. See scripts/sync_style_guides.dart.

on:
  push:
    branches: [main]
    paths:
      - 'style_guides/**'
      - 'scripts/sync_style_guides.dart'
      - '.github/workflows/sync_style_guides.yml'
  pull_request:
    paths:
      - 'style_guides/**'
      - 'scripts/sync_style_guides.dart'
      - '.github/workflows/sync_style_guides.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two merges close together would otherwise race to force-update the same
# sync branch in each target, and the older run could finish last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The guides are copied into repositories that have none of this repo's
  # other files, so a link out of `style_guides/` must fail before merge.
  check:
    runs-on:
      group: github-public-ubuntu-static
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Install Dart
        uses: dart-lang/setup-dart@v1

      - name: 🔗 Check Guide Links
        run: dart run scripts/sync_style_guides.dart --check

  # Only `main` syncs, so a manual run on another branch cannot push its
  # unreviewed guides into the other repositories with the CI bot's token.
  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on:
      group: github-public-ubuntu-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: stream-chat-flutter
            branch: master
          - repository: stream-video-flutter
            branch: v2
          - repository: stream-feeds-flutter
            branch: main
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      # An app token covers only the repositories it is minted for, so each
      # job asks for its own target rather than this repository.
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}

      - name: 📚 Checkout ${{ matrix.repository }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          ref: ${{ matrix.branch }}
          path: target
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: 🎯 Install Dart
        uses: dart-lang/setup-dart@v1

      - name: 📝 Copy Style Guides
        run: dart run scripts/sync_style_guides.dart target

      # Opened with the CI bot's app token so the pull request's checks run,
      # which they don't for one opened with the workflow's own token. Nothing is
      # opened when the copy is already up to date, and an open sync PR is
      # updated in place rather than duplicated.
      - name: 📤 Open Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ steps.ci-bot-token.outputs.token }}
          sign-commits: true
          base: ${{ matrix.branch }}
          branch: chore/sync-style-guides
          delete-branch: true
          add-paths: style_guides/**
          commit-message: 'docs(repo): sync the shared style guides from stream-core-flutter'
          title: 'docs(repo): sync the shared style guides from stream-core-flutter'
          body: |
            Copies `style_guides/` from [GetStream/stream-core-flutter@${{ github.sha }}](https://github.com/GetStream/stream-core-flutter/commit/${{ github.sha }}).

            These files are generated; change them in stream-core-flutter, not here.
