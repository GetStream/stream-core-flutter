name: release_tag

on:
  push:
    branches: [main]

concurrency:
  # Keyed on the branch ref, so back-to-back release merges share this group.
  # cancel-in-progress must stay false: cancelling a run mid tag-push would
  # silently drop a release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Run only for release commits. GitHub expressions have no regex, so the
    # `chore(<scope>): release ...` prefix is matched with startsWith + contains.
    if: "${{ startsWith(github.event.head_commit.message, 'chore(') && contains(github.event.head_commit.message, '): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create and push tags
    steps:
      - name: 📚 Checkout branch
        # Bot PAT (not the default GITHUB_TOKEN): tags pushed with GITHUB_TOKEN
        # do not trigger the `on: push: tags` publish workflow.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_API_TOKEN }}

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📦 Install Tools
        # melos exec --no-published queries pub.dev, so melos must be installed.
        # No bootstrap needed — package discovery does not require it.
        run: flutter pub global activate melos

      - name: 🏷️ Tag unpublished packages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Stream SDK Bot"
          git config user.email "60655709+Stream-SDK-Bot@users.noreply.github.com"

          # Tag every publishable package whose current version is not yet on
          # pub.dev. Tags are derived from package state, not parsed from the
          # commit message, so multi-package release PRs and title typos are
          # handled correctly. `|| true`: an unchanged package may already
          # carry its tag from a previous release.
          #
          # Single quotes are intentional: the string is passed verbatim to
          # melos, which expands $MELOS_PACKAGE_NAME/$MELOS_PACKAGE_VERSION in
          # each package's child shell.
          # shellcheck disable=SC2016
          melos exec --no-published --no-private -- \
            'git tag "$MELOS_PACKAGE_NAME-v$MELOS_PACKAGE_VERSION" || true'

          # Push tags one at a time (`-c 1`) — bulk pushes can drop individual
          # tag events, which would skip the publish workflow — and in
          # dependency order (`--order-dependents`: dependencies first) so a
          # dependent's publish is triggered after its dependency's, minimising
          # the wait in release_publish's dependency gate. Idempotent: pushing a
          # tag that already exists on the remote is a no-op.
          # shellcheck disable=SC2016
          melos exec -c 1 --no-published --no-private --order-dependents -- \
            'git push origin "$MELOS_PACKAGE_NAME-v$MELOS_PACKAGE_VERSION"'
