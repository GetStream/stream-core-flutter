name: update_top_level_domains

on:
  schedule:
    # Runs "At 06:00 on the 1st of every month"
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_top_level_domains:
    name: Update Top-Level Domains
    runs-on:
      group: github-public-amd64
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🎯 Install Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      # Leaves the file as it is when the list of domains has not changed, so
      # no pull request is opened then.
      - name: 🌐 Regenerate Top-Level Domains
        run: dart run scripts/generate_top_level_domains.dart

      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      # Opened with the CI bot's app token so the pull request's checks run, which
      # they don't for one opened with the workflow's own token.
      - name: 📤 Open Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.ci-bot-token.outputs.token }}
          branch: chore/update-top-level-domains
          delete-branch: true
          sign-commits: true
          commit-message: 'chore(repo): update the IANA top-level domains'
          title: 'chore(repo): update the IANA top-level domains'
          body: |
            Regenerates the top-level domains `findLinks` recognizes from the IANA root zone list with `melos run generate:tlds`.
