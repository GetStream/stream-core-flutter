name: web_deploy

# Reusable workflow that builds a Flutter web app and deploys it to
# https://flutter.getstream.io/<app>/ (prod) or /<app>/beta/ (beta). The
# hosting is set up in GetStream/chat, infra/flutter-web.
#
# Every app on that host shares one origin, so one browser storage. The build
# gets these defines to keep its storage and behavior apart:
#
#   WEB_FLAVOR          prod or beta.
#   WEB_STORAGE_PREFIX  <app>_ on prod and <app>_beta_ on beta, with dashes in
#                       <app> replaced by underscores. Prefix every key the app
#                       stores in the browser with it.
#
# A deploy also removes the pull request builds of web_deploy_pr.yml that were
# last deployed over 30 days ago.
#
# The caller decides when to deploy and with which flavor. It needs the GitHub
# environment `flutter-web`, which the identity provider requires, and grants
# `contents: read` and `id-token: write`. The environment's branch and tag rules
# must allow every ref the caller deploys from, release tags included. Fork pull
# requests can't deploy: their runs get no identity token.

on:
  workflow_call:
    inputs:
      app:
        description: The top-level folder on the host, such as `video`, `chat` or `design-system`.
        required: true
        type: string
      flavor:
        description: "`prod` deploys to /<app>/, `beta` to /<app>/beta/."
        required: true
        type: string
      working-directory:
        description: The Flutter app to build, such as `apps/design_system_gallery`.
        required: true
        type: string
      bootstrap:
        description: Run `melos bootstrap` before building, so the app resolves the packages of this repository.
        required: false
        type: boolean
        default: false
      flutter-version:
        description: The Flutter version to build with. Empty takes the latest of `flutter-channel`.
        required: false
        type: string
        default: ""
      flutter-channel:
        description: The Flutter channel to build with.
        required: false
        type: string
        default: stable
      wasm:
        description: Compile to WebAssembly.
        required: false
        type: boolean
        default: true
      build-args:
        description: More arguments for `flutter build web`, split on spaces.
        required: false
        type: string
        default: ""
    outputs:
      url:
        description: The URL the app was deployed to.
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: web-deploy-${{ inputs.app }}-${{ inputs.flavor }}
      cancel-in-progress: true
    environment:
      name: flutter-web
      url: https://flutter.getstream.io/${{ inputs.app }}/${{ inputs.flavor == 'beta' && 'beta/' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.target.outputs.url }}
    env:
      APP: ${{ inputs.app }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - name: 🎯 Resolve Target
        id: target
        run: |
          if [[ ! $APP =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::app must be a lowercase folder name, got '$APP'"
            exit 1
          fi
          case $FLAVOR in
            prod) WEB_PATH=$APP; PREFIX=${APP//-/_}_ ;;
            beta) WEB_PATH=$APP/beta; PREFIX=${APP//-/_}_beta_ ;;
            *) echo "::error::flavor must be prod or beta, got '$FLAVOR'"; exit 1 ;;
          esac
          echo "WEB_PATH=$WEB_PATH" >> "$GITHUB_ENV"
          echo "WEB_STORAGE_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "url=https://flutter.getstream.io/$WEB_PATH/" >> "$GITHUB_OUTPUT"

      - name: 📚 Checkout
        uses: actions/checkout@v6

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}

      - name: 🧩 Bootstrap Workspace
        if: inputs.bootstrap
        run: |
          flutter pub global activate melos
          flutter pub global run melos bootstrap

      - name: 🏗️ Build
        working-directory: ${{ inputs.working-directory }}
        env:
          WASM: ${{ inputs.wasm }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          args=(
            --release
            --base-href "/$WEB_PATH/"
            --dart-define=WEB_FLAVOR="$FLAVOR"
            --dart-define=WEB_STORAGE_PREFIX="$WEB_STORAGE_PREFIX"
          )
          if [[ $WASM == true ]]; then args+=(--wasm); fi
          read -ra extra <<< "$BUILD_ARGS"
          flutter build web "${args[@]}" "${extra[@]}"

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/675676272957/locations/global/workloadIdentityPools/github-actions/providers/github-flutter
          service_account: flutter-web-deployer@stream-gcp-2026-v2.iam.gserviceaccount.com

      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The prod folder holds the beta build in beta/ and the pull request
      # builds in pr/, so the sync leaves those alone.
      #
      # index.html is also served for every app route, and a revalidation of
      # such a route comes back as an empty 200. It is uploaded last, after the
      # files it loads, and never stored by the browser.
      - name: 🚀 Deploy
        env:
          BUILD_DIR: ${{ inputs.working-directory }}/build/web
        run: |
          gcloud storage rsync "$BUILD_DIR" "gs://stream-flutter-web/$WEB_PATH" \
            --recursive --delete-unmatched-destination-objects \
            --exclude='^beta/|^pr/|^index\.html$' \
            --cache-control="public, max-age=60"
          gcloud storage cp "$BUILD_DIR/index.html" "gs://stream-flutter-web/$WEB_PATH/index.html" \
            --cache-control="no-store"

      # web_deploy_pr.yml removes a build with its pull request; this removes
      # the ones left behind. Every deploy uploads index.html again, so its
      # date is the build's last deploy.
      - name: 🧹 Remove Pull Request Builds Older Than 30 Days
        run: |
          cutoff=$(date -u -d '30 days ago' +%s)
          # The listing fails when there is no pull request build.
          builds=$(gcloud storage ls --long "gs://stream-flutter-web/$APP/pr/*/index.html" 2>/dev/null || true)
          while read -r _ updated url; do
            [[ $url == gs://*/index.html ]] || continue
            if (( $(date -u -d "$updated" +%s) < cutoff )); then
              echo "Removing ${url%index.html}, last deployed $updated"
              gcloud storage rm --recursive "${url%index.html}"
            fi
          done <<< "$builds"
