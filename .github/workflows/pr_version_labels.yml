name: pr_version_labels

# Reusable workflow that labels a pull request with the major version it
# targets, such as `v10`:
#
#   - A branch named like a version (`v9`, `v11`) gives its own name.
#   - The default branch gives the major of the version in `version-file`.
#   - A stacked pull request gives the version of the stack's base.
#
# A version label that no longer matches is removed, and a missing one is
# created. Call it from a workflow that runs on `pull_request` with at least
# the types `opened`, `reopened` and `edited`, and grants `contents: read`,
# `issues: write` and `pull-requests: write`.
#
# Fork pull requests get a read-only token, so they aren't labelled.

on:
  workflow_call:
    inputs:
      version-file:
        description: The pubspec whose version the default branch releases, such as `packages/stream_chat/pubspec.yaml`.
        required: true
        type: string

jobs:
  version_label:
    name: Label the Version Bump
    # Runs when a pull request opens or changes base; other events are ignored,
    # so it can share a caller with workflows triggered by more events.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
        (github.event.action == 'edited' && github.event.changes.base))
    concurrency:
      group: pr-version-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on:
      group: github-public-amd64
    timeout-minutes: 5
    steps:
      - name: 🏷️ Label Version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const isVersionLabel = (name) => /^v\d+$/.test(name);

            // This run may start after a later base change; use the live pull request.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });

            // A stacked pull request targets the branch of the one below it,
            // so follow the open pull requests down to the stack's base.
            let base = pr.base.ref;
            for (let depth = 0; depth < 20; depth++) {
              if (isVersionLabel(base) || base === defaultBranch) break;
              const { data: below } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${base}`,
              });
              if (below.length === 0) break;
              base = below[0].base.ref;
            }

            let wanted = base;
            if (!isVersionLabel(base)) {
              if (base !== defaultBranch) {
                core.info(`${base} is not a version branch, nothing to do`);
                return;
              }
              const { data } = await github.rest.repos.getContent({
                owner, repo, ref: base, path: process.env.VERSION_FILE,
              });
              const pubspec = Buffer.from(data.content, 'base64').toString();
              const major = pubspec.match(/^version:\s*['"]?(\d+)\./m)?.[1];
              if (!major) {
                core.setFailed(`No version found in ${process.env.VERSION_FILE} on ${base}`);
                return;
              }
              wanted = `v${major}`;
            }

            // Read live labels; the event payload can be stale by the time this runs.
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const current = labels.map((l) => l.name);

            for (const name of current) {
              if (isVersionLabel(name) && name !== wanted) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
                core.info(`Removed "${name}"`);
              }
            }

            if (current.includes(wanted)) return;
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: wanted, color: '0E8A16',
                description: `Targets the ${wanted} release line`,
              });
            } catch (e) {
              // 422: the label already exists.
              if (e.status !== 422) throw e;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [wanted] });
            core.info(`Added "${wanted}"`);
